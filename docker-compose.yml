version: '3.8'

# ============================================================================
# SOCIETY MANAGEMENT SYSTEM - DOCKER COMPOSE
# ============================================================================
# Start all services: docker-compose up -d
# View logs: docker-compose logs -f
# Stop services: docker-compose down
# ============================================================================

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: society_db
    environment:
      POSTGRES_DB: society_management
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_INITDB_ARGS: "-c max_connections=100"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - society_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: society_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-password123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - society_network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: society_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@db:5432/society_management
      REDIS_URL: redis://:${REDIS_PASSWORD:-password123}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG_MODE: ${DEBUG_MODE:-True}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - society_network

  # Celery Worker for Background Jobs
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: society_celery_worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@db:5432/society_management
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-password123}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-password123}@redis:6379/2
    depends_on:
      - db
      - redis
      - backend
    command: celery -A tasks worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    networks:
      - society_network

  # Celery Beat for Scheduled Tasks
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: society_celery_beat
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password123}@db:5432/society_management
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-password123}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-password123}@redis:6379/2
    depends_on:
      - db
      - redis
      - backend
    command: celery -A tasks beat --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./logs:/app/logs
    networks:
      - society_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: society_frontend
    environment:
      REACT_APP_API_URL: http://backend:8000/api/v1
      REACT_APP_WS_URL: ws://backend:8000/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm start
    networks:
      - society_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: society_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - society_network

  # Prometheus for Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: society_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - society_network

  # Grafana for Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: society_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: 'grafana-worldmap-panel'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - society_network

  # PgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: society_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - society_network

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  society_network:
    driver: bridge

# ============================================================================
# CONFIGURATION NOTES
# ============================================================================
# 1. Create .env file in root directory before running
# 2. Update credentials in .env file
# 3. Update POSTGRES_* variables if needed
# 4. Update REDIS_PASSWORD if needed
# 5. Configure Razorpay and Twilio credentials
# 6. Setup SSL certificates for production
# 7. Update nginx.conf for your domain
#
# ACCESS POINTS AFTER STARTUP:
# - Backend API: http://localhost:8000
# - Frontend: http://localhost:3000
# - API Documentation: http://localhost:8000/api/docs
# - PgAdmin: http://localhost:5050
# - Prometheus: http://localhost:9090
# - Grafana: http://localhost:3001
# ============================================================================
